# CD: main に入ったものを本番に配る。
#
# 手元からの `wrangler deploy` と決定的に違う点:
#   wrangler は git のコミットではなく「その場の作業ツリー」をビルドする。
#   手元から流すと、コミットしていない実験コードが本番に出たり、
#   「main にマージしたつもり」のものが実は出ていなかったりする。
#   CI のランナーは毎回まっさらなチェックアウトしか持たないため、
#   作業ツリー = コミット が常に一致する。この問題が構造的に消える。
#
# npm / yarn / pnpm のどれでもそのまま動く（ロックファイルから自動判別する）。
name: Deploy

on:
  push:
    branches: [main]
  # 再デプロイしたいときのため
  workflow_dispatch:

concurrency:
  # D1変更・デプロイの途中で打ち切ったり、復旧用Migrateと重ねたりしない。
  group: production-d1-and-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # workflow_dispatch の画面では実行元branchを選べる。再デプロイでも
      # main以外の未承認コードを本番へ出さないよう、ここで明示的に止める。
      - name: main のコミットであることを確認
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::本番へ配布できるのは main のコミットだけです（実行元: $GITHUB_REF）。"
          exit 1

      - uses: actions/checkout@v4

      - name: パッケージマネージャを判別
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "name=pnpm"                              >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=pnpm run"                           >> "$GITHUB_OUTPUT"
            echo "exec=pnpm exec"                         >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            if [ -f .yarnrc.yml ]; then
              echo "install=yarn install --immutable"       >> "$GITHUB_OUTPUT"
            else
              echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            fi
            echo "name=yarn"    >> "$GITHUB_OUTPUT"
            echo "run=yarn run" >> "$GITHUB_OUTPUT"
            echo "exec=yarn"    >> "$GITHUB_OUTPUT"
          else
            echo "name=npm"       >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "run=npm run"    >> "$GITHUB_OUTPUT"
            echo "exec=npx"       >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.pm.outputs.name == 'pnpm'
        # バージョンは package.json の packageManager から読ませる。
        # ここで version: を指定すると、packageManager がある repo では
        # 「Multiple versions of pnpm specified」で落ちる。

      - uses: actions/setup-node@v4
        with:
          # wrangler が Node 22 以上を要求する。20 だと cf-typegen で落ちる。
          node-version: 22
          cache: ${{ steps.pm.outputs.name }}

      - name: 依存関係のインストール（${{ steps.pm.outputs.name }}）
        run: ${{ steps.pm.outputs.install }}

      - name: 文書 drift 検査
        run: ${{ steps.pm.outputs.run }} check:docs

      # Cloudflare のバインディング（DB接続など）の型定義を生成する。
      # このファイルは Git 管理外なので、まっさらなチェックアウトには存在しない。
      # これを飛ばすと「手元では通るのに CI のビルドだけ型エラーで落ちる」になる。
      # cf-typegen スクリプトがないプロジェクトではこのステップごと削除してよい。
      - name: 型定義の生成
        run: ${{ steps.pm.outputs.run }} cf-typegen

      # デプロイ前にもう一度だけ確認する。CI が通っていても、
      # マージ結果の組み合わせで壊れることがある。
      - name: 型チェック
        run: ${{ steps.pm.outputs.run }} typecheck

      # CI ワークフローとは独立に、実際に配るものと同じ checkout を検査する。
      # main push で CI と Deploy が同時に始まっても、未テストの SHA は配らない。
      - name: テスト（カバレッジ含む）
        run: ${{ steps.pm.outputs.run }} test:coverage

      - name: ビルド
        run: ${{ steps.pm.outputs.run }} cf:dry-run

      # 無料プランの圧縮後アップロード上限（3,072 KiB）にどれだけ近いかを、
      # 実際にデプロイする前に確認する。認証情報は不要（--dry-run のため）。
      #   - 上限を超えている場合だけワークフローを失敗させる（デプロイを止める）
      #   - 上限の80%を超えた場合は警告のみ（正常なデプロイは止めない）
      # 詳細: docs/product/backlog.md「E. 性能」、scripts/check-bundle-size.mjs
      - name: 公開ファイルの容量チェック
        run: ${{ steps.pm.outputs.run }} check:bundle-size

      # migrations list は未適用ファイルだけを返すが JSON 出力を持たない。
      # 専用スクリプトで clear / pending を分類し、未知の出力は fail-closed にする。
      - name: 本番 D1 の未適用マイグレーション確認
        id: migration_plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          report="$RUNNER_TEMP/d1-migrations-before-deploy.txt"
          if ! ${{ steps.pm.outputs.exec }} wrangler d1 migrations list hr-evaluation-db --remote >"$report" 2>&1; then
            cat "$report"
            echo "::error::本番 D1 の未適用マイグレーション確認を実行できませんでした。"
            exit 1
          fi
          cat "$report"
          if ! status=$(node scripts/verify-d1-migrations-list.mjs "$report" --print-status); then
            exit 1
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = "pending" ]; then
            echo "::notice::未適用マイグレーションを検出したため、バックアップ後に自動適用します。"
          fi

      # 未適用がある場合だけ、変更前の本番DBを退避する。
      # バックアップに失敗したら以降の適用・デプロイは実行されない。
      - name: 本番 D1 のバックアップ取得
        if: steps.migration_plan.outputs.status == 'pending'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ${{ steps.pm.outputs.run }} db:backup

      - name: 本番 D1 のバックアップを保管
        if: always() && steps.migration_plan.outputs.status == 'pending'
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: backup.sql
          if-no-files-found: error
          retention-days: 14

      - name: 本番 D1 のマイグレーション適用
        if: steps.migration_plan.outputs.status == 'pending'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ${{ steps.pm.outputs.run }} db:migrate:remote

      # apply の終了コードだけで完了とみなさず、同じ本番DBを再照会する。
      # 未適用が元から0件だった場合も、配布直前の最終確認として実行する。
      - name: 適用後の未適用マイグレーション確認
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          report="$RUNNER_TEMP/d1-migrations-after-apply.txt"
          if ! ${{ steps.pm.outputs.exec }} wrangler d1 migrations list hr-evaluation-db --remote >"$report" 2>&1; then
            cat "$report"
            echo "::error::マイグレーション適用後の本番 D1 を再確認できませんでした。"
            exit 1
          fi
          cat "$report"
          node scripts/verify-d1-migrations-list.mjs "$report"

      - name: デプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # ビルドは上のステップで済んでいるので、ここでは配布だけ行う
        # （opennextjs-cloudflare deploy は再ビルドしない）。
        run: ${{ steps.pm.outputs.run }} deploy:worker

      # --- ここから配ったあとの確認 ---
      #
      # Cloudflare Workers は新しいコードを配った後も、すでに起動している
      # 古いプロセス（アイソレータ）がしばらく残る。数十秒〜1〜2分。
      # だから「1回叩いて 200 が返った」では反映の確認にならない。
      # 時間を空けて2回叩き、2回とも通って初めて合格とする。

      - name: 1回目までの待機
        run: sleep 30

      - name: スモークテスト（1回目）
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: bash .github/scripts/smoke.sh

      - name: 2回目までの待機
        run: sleep 90

      - name: スモークテスト（2回目）
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: bash .github/scripts/smoke.sh

      - name: 失敗したときの案内
        if: failure()
        run: |
          echo "::error::デプロイ後の確認に失敗しました。"
          echo "自動では元に戻していません。以下で状況を確認し、人が判断してください。"
          echo "  npx wrangler deployments list"
          echo "  npx wrangler rollback [deployment-id]"
          echo "『本当に壊れている』のか『まだ古いプロセスが残っているだけ』なのかを"
          echo "機械は区別できないため、ロールバックは自動実行していません。"

# マイグレーションは、検査・テスト・ビルドがすべて成功した後にだけ自動適用する。
# 未適用検出 → バックアップ → 適用 → 未適用0件の再確認 → デプロイの順を固定し、
# D1操作とデプロイを同じconcurrency groupで直列化する。
