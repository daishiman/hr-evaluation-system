# CD: main に入ったものを本番に配る。
#
# 手元からの `wrangler deploy` と決定的に違う点:
#   wrangler は git のコミットではなく「その場の作業ツリー」をビルドする。
#   手元から流すと、コミットしていない実験コードが本番に出たり、
#   「main にマージしたつもり」のものが実は出ていなかったりする。
#   CI のランナーは毎回まっさらなチェックアウトしか持たないため、
#   作業ツリー = コミット が常に一致する。この問題が構造的に消える。
#
# 2つの job に分ける（DD-032）。
#   verify-build: 検査・テスト・ビルドと、ビルド成果物の静的検査。本番の鍵を持たない。
#   deploy:       verify-build の成果物だけを受け取り、D1 の適用と配布をする。
#                 ビルドはせず、依存の install scripts も走らせない。
# 成果物は Actions に1日だけ置き、deploy が受け取ったらすぐ消す。
# そのため deploy の job だけを流し直すことはできない。流し直すときはワークフロー全体を流す。
name: Deploy

on:
  push:
    branches: [main]
  # 再デプロイしたいときのため（ワークフロー全体を流す）
  workflow_dispatch:

concurrency:
  # D1変更・デプロイの途中で打ち切ったり、復旧用Migrateと重ねたりしない。
  group: production-d1-and-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: main ブランチからの実行か確認
        if: github.ref != 'refs/heads/main'
        run: |
          printf '::error::本番へのデプロイは main ブランチからだけ実行できます。\n'
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # pnpm の版は package.json の packageManager から読む。
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # Node の版は .nvmrc の1か所だけで決める（手元・CI・本番の配布で同じ版にする）。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 依存のインストール
        run: pnpm install --frozen-lockfile

      - name: 文書と実装の食い違い検査
        run: pnpm run check:docs

      # cloudflare-env.d.ts は .gitignore されているので、型チェックの前に作る。
      - name: Cloudflare の型定義を生成
        run: pnpm run cf-typegen

      - name: 型チェック
        run: pnpm run typecheck

      - name: テスト（網羅率の下限つき）
        run: pnpm run test:coverage

      - name: Cloudflare 向けビルド
        run: pnpm run cf:dry-run

      - name: バンドルサイズ確認
        run: pnpm run check:bundle-size

      - name: 危ない書き方の検査（リポジトリ）
        run: pnpm run check:security

      # 配る直前の成果物に、.env・ソースマップ・秘密の値が紛れていないかを見る。
      - name: 危ない書き方の検査（ビルド成果物）
        run: node scripts/check-security-patterns.mjs --dir .open-next

      # .open-next/.build のような隠しディレクトリも配布に要るので含める。
      - name: ビルド成果物を deploy の job に渡す
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: open-next-${{ github.run_id }}
          path: |
            .open-next/
            !.open-next/**/*.map
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 承認者と保護ルールは、利用者が GitHub の production 環境に設定する。
    environment: production
    # actions: write は、受け取った成果物を消すためだけに使う。
    permissions:
      actions: write
      contents: read

    steps:
      - name: main ブランチからの実行か確認
        if: github.ref != 'refs/heads/main'
        run: |
          printf '::error::本番へのデプロイは main ブランチからだけ実行できます。\n'
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # pnpm の版は package.json の packageManager から読む。
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # Node の版は .nvmrc の1か所だけで決める（手元・CI・本番の配布で同じ版にする）。
      # 依存の cache は戻さない。秘密の無い job が依存のコードを動かした後に保存したものだから（DD-032 の13）。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      # 本番の鍵を持つ job では、依存の install scripts を走らせない。
      - name: 依存のインストール（install scripts なし）
        run: pnpm install --frozen-lockfile --ignore-scripts

      # artifact-ids で受けるときは merge-multiple を付けないと、成果物の名前の dir の下に展開される。
      - name: ビルド成果物の受け取り
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.verify-build.outputs.artifact-id }}
          path: .open-next
          merge-multiple: true

      - name: ビルド成果物を Actions から消す
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.verify-build.outputs.artifact-id }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"

      # migrations list は未適用ファイルだけを返すが JSON 出力を持たない。
      # 専用スクリプトで clear / pending を分類し、未知の出力は fail-closed にする。
      - name: 本番 D1 の未適用マイグレーション確認
        id: migration_plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          report="$RUNNER_TEMP/d1-migrations-before-deploy.txt"
          if ! pnpm exec wrangler d1 migrations list hr-evaluation-db --remote >"$report" 2>&1; then
            cat "$report"
            printf '::error::本番 D1 の未適用マイグレーション確認を実行できませんでした。\n'
            exit 1
          fi
          cat "$report"
          if ! status=$(node scripts/verify-d1-migrations-list.mjs "$report" --print-status); then
            exit 1
          fi
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = "pending" ]; then
            printf '::notice::未適用マイグレーションを検出したため、戻り先を記録してから自動適用します。\n'
          fi

      # 適用の前に、今の本番 D1 の戻り先（Time Travel の bookmark）を実行の Summary に残す。
      # DB の中身を書き出して Actions に置くことはしない（公開リポジトリでは誰でも取れるため。DD-032）。
      # 戻すときは、この bookmark を `wrangler d1 time-travel restore` に渡す。記録できなければ適用しない。
      - name: 本番 D1 の戻り先を記録（Time Travel）
        if: steps.migration_plan.outputs.status == 'pending'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          report="$RUNNER_TEMP/d1-time-travel.txt"
          if ! pnpm exec wrangler d1 time-travel info hr-evaluation-db >"$report" 2>&1; then
            cat "$report"
            printf '::error::本番 D1 の戻り先を記録できなかったため、中止します。\n'
            exit 1
          fi
          cat "$report"
          {
            printf '## 適用前の本番 D1 の戻り先（Time Travel）\n\n'
            printf '```text\n'
            cat "$report"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 本番 D1 のマイグレーション適用
        if: steps.migration_plan.outputs.status == 'pending'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run db:migrate:remote

      # apply の終了コードだけで完了と見なさず、同じ本番 DB を再照会する。
      # 認証・通信失敗や未知の出力も成功扱いにしない。
      # 未適用が元から0件だった場合も、配布直前の最終確認として実行する。
      - name: 適用後の未適用マイグレーション確認
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          report="$RUNNER_TEMP/d1-migrations-after-apply.txt"
          if ! pnpm exec wrangler d1 migrations list hr-evaluation-db --remote >"$report" 2>&1; then
            cat "$report"
            printf '::error::マイグレーション適用後の本番 D1 を再確認できませんでした。\n'
            exit 1
          fi
          cat "$report"
          node scripts/verify-d1-migrations-list.mjs "$report"

      # ビルドは verify-build で済んでいるので、ここでは配布だけ行う
      # （opennextjs-cloudflare deploy は再ビルドしない）。
      - name: デプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy:worker

      # --- ここから配ったあとの確認 ---
      #
      # Cloudflare Workers は新しいコードを配った後も、すでに起動している
      # 古いプロセス（アイソレータ）がしばらく残る。数十秒〜1〜2分。
      # だから「1回叩いて 200 が返った」では反映の確認にならない。
      # 時間を空けて2回叩き、2回とも通って初めて合格とする。

      - name: 1回目までの待機
        run: sleep 30

      - name: スモークテスト（1回目）
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: bash .github/scripts/smoke.sh

      - name: 2回目までの待機
        run: sleep 90

      - name: スモークテスト（2回目）
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: bash .github/scripts/smoke.sh

      - name: 失敗したときの案内
        if: failure()
        run: |
          printf '::error::デプロイか、その後の確認に失敗しました。\n'
          printf '%s\n' \
            '自動では元に戻していません。以下で状況を確認し、人が判断してください。' \
            '  npx wrangler deployments list' \
            '  npx wrangler rollback [deployment-id]' \
            'D1 を戻すときは、この実行の Summary にある bookmark を使います。' \
            '  npx wrangler d1 time-travel restore hr-evaluation-db --bookmark=[bookmark]' \
            '『本当に壊れている』のか『まだ古いプロセスが残っているだけ』なのかを' \
            '機械は区別できないため、ロールバックは自動実行していません。'

# マイグレーションは、検査・テスト・ビルドがすべて成功した後にだけ自動適用する。
# 未適用検出 → 戻り先の記録（Time Travel）→ 適用 → 未適用0件の再確認 → デプロイの順を固定し、
# D1操作とデプロイを同じconcurrency groupで直列化する。
