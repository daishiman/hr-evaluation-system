# 復旧・先行適用用の手動マイグレーション。
# 通常は Deploy workflow がバックアップ取得後に自動適用するため、このworkflowの実行は不要。
# Deployが適用後に失敗した場合の再確認や、互換migrationだけを先行適用したい場合に使う。
#
# 設計方針:
#   - 引き金は手動のみ（workflow_dispatch）。push では絶対に動かさない。
#   - 実行前に必ずバックアップを取る。取れなければ止まる。
#   - confirm 欄に APPLY と打たないと進まない。押し間違いで本番が変わるのを防ぐ。
#     （Environments の承認者機能は private + Free プランでは使えないため、この方式で代替する）
#
# 対象データベースは hr-evaluation-db（wrangler.jsonc の d1_databases.database_name と一致）。
#
# npm / yarn / pnpm のどれでもそのまま動く（ロックファイルから自動判別する）。
name: Migrate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 対象環境
        type: choice
        options: [production]
        required: true
      confirm:
        description: 本番DBを変更します。よければ APPLY と入力してください
        type: string
        required: true

concurrency:
  # 自動Deploy内のD1変更とも重ねない。走行中は待たせる（打ち切らない）。
  group: production-d1-and-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 入力確認
        # ここで落ちれば以降は一切実行されない。
        if: ${{ inputs.confirm != 'APPLY' }}
        run: |
          echo "::error::confirm に APPLY と入力されていません。中止します。"
          exit 1

      # workflow_dispatch で別branchを選ばれても、本番DBへ適用するSQLは
      # current SSOTであるmainだけから読む。
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: パッケージマネージャを判別
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "name=pnpm"                              >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=pnpm run"                           >> "$GITHUB_OUTPUT"
            echo "exec=pnpm exec"                         >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            if [ -f .yarnrc.yml ]; then
              echo "install=yarn install --immutable"       >> "$GITHUB_OUTPUT"
            else
              echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            fi
            echo "name=yarn"    >> "$GITHUB_OUTPUT"
            echo "run=yarn run" >> "$GITHUB_OUTPUT"
            echo "exec=yarn"    >> "$GITHUB_OUTPUT"
          else
            echo "name=npm"       >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "run=npm run"    >> "$GITHUB_OUTPUT"
            echo "exec=npx"       >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.pm.outputs.name == 'pnpm'
        # バージョンは package.json の packageManager から読ませる。
        # ここで version: を指定すると、packageManager がある repo では
        # 「Multiple versions of pnpm specified」で落ちる。

      - uses: actions/setup-node@v4
        with:
          # wrangler が Node 22 以上を要求する。20 だと cf-typegen で落ちる。
          node-version: 22
          cache: ${{ steps.pm.outputs.name }}

      - name: 依存関係のインストール（${{ steps.pm.outputs.name }}）
        run: ${{ steps.pm.outputs.install }}

      # 書き出しは age の公開鍵で暗号化してから残す（DD-031）。
      # 受け手の公開鍵が無いか形が違えば、書き出す前に止める。
      - name: バックアップの暗号化の準備
        env:
          D1_BACKUP_AGE_RECIPIENT: ${{ vars.D1_BACKUP_AGE_RECIPIENT }}
        run: |
          bash .github/scripts/encrypt-d1-backup.sh check
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          age --version

      # 先にバックアップ。ここが失敗したらマイグレーションには進ませない。
      - name: バックアップ取得
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ${{ steps.pm.outputs.run }} db:backup

      # 暗号化したら平文の backup.sql は消す。保管するのは backup.sql.age だけ。
      - name: バックアップを暗号化
        env:
          D1_BACKUP_AGE_RECIPIENT: ${{ vars.D1_BACKUP_AGE_RECIPIENT }}
        run: bash .github/scripts/encrypt-d1-backup.sh encrypt

      # 後から取り出せるように残す。
      # 注意: このリポジトリは Public なので、Artifact は GitHub にログインした誰もが
      # 落とせる。だから平文は置かず、暗号化したものだけを置く。開く鍵（秘密鍵）は
      # 利用者の手元にだけあり、CI には公開鍵しか渡さない。
      - name: バックアップを保管
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: backup.sql.age
          if-no-files-found: error
          retention-days: 14

      - name: 未適用のマイグレーションを表示
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ${{ steps.pm.outputs.exec }} wrangler d1 migrations list hr-evaluation-db --remote

      - name: マイグレーション適用
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ${{ steps.pm.outputs.run }} db:migrate:remote

      # apply の終了コードだけで完了と見なさず、同じ本番 DB を再照会する。
      # 認証・通信失敗や未知の出力も成功扱いにしない。
      - name: 適用後の未適用マイグレーション確認
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          report="$RUNNER_TEMP/d1-migrations-after-apply.txt"
          if ! ${{ steps.pm.outputs.exec }} wrangler d1 migrations list hr-evaluation-db --remote >"$report" 2>&1; then
            cat "$report"
            echo "::error::適用後の本番 D1 を再確認できませんでした。"
            exit 1
          fi
          cat "$report"
          node scripts/verify-d1-migrations-list.mjs "$report"

# 手動で適用した場合は、このあと必ず Deploy を実行すること。
# 順番は「マイグレーション → デプロイ」で固定。逆にすると、新しいアプリが
# まだ存在しない列を読みにいって本番が落ちる。
#
# 「マイグレーションだけ済んで、アプリは古いまま」はexpand migrationなら安全な状態。
# 列が増えただけなら古いアプリはその列を知らないだけで動き続ける。
# 途中で止まったときは、この状態で止めておけばよい。
