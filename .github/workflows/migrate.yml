# 復旧・先行適用用の手動マイグレーション。
# 通常は Deploy workflow が戻り先（Time Travel）を記録してから自動適用するため、このworkflowの実行は不要。
# Deployが適用後に失敗した場合の再確認や、互換migrationだけを先行適用したい場合に使う。
#
# 設計方針:
#   - 引き金は手動のみ（workflow_dispatch）。push では絶対に動かさない。
#   - 適用の前に、本番 D1 の戻り先（Time Travel の bookmark）を実行の Summary に残す。残せなければ止まる。
#   - confirm 欄に APPLY と打たないと進まない。押し間違いで本番が変わるのを防ぐ。
#     production 環境の承認とは別の確認。環境の承認者・保護ルールは利用者が設定する。
#
# 対象データベースは hr-evaluation-db（wrangler.jsonc の d1_databases.database_name と一致）。
name: Migrate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 対象環境
        type: choice
        options: [production]
        required: true
      confirm:
        description: 本番DBを変更します。よければ APPLY と入力してください
        type: string
        required: true

concurrency:
  # 自動Deploy内のD1変更とも重ねない。走行中は待たせる（打ち切らない）。
  group: production-d1-and-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deploy と同じ本番環境の承認を通す（承認者の設定は利用者が行う）。
    environment: production

    steps:
      - name: 入力確認
        # ここで落ちれば以降は一切実行されない。
        if: ${{ inputs.confirm != 'APPLY' }}
        run: |
          printf '::error::confirm に APPLY と入力されていません。中止します。\n'
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false

      # pnpm の版は package.json の packageManager から読む。
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # Node の版は .nvmrc の1か所だけで決める（手元・CI・本番の配布で同じ版にする）。
      # 依存の cache は戻さない。秘密の無い job が依存のコードを動かした後に保存したものだから（DD-032 の13）。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      # 本番の鍵を持つ job では、依存の install scripts を走らせない。
      - name: 依存のインストール（install scripts なし）
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 未適用のマイグレーションを表示
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations list hr-evaluation-db --remote

      # 適用の前に、今の本番 D1 の戻り先（Time Travel の bookmark）を実行の Summary に残す。
      # DB の中身を書き出して Actions に置くことはしない（公開リポジトリでは誰でも取れるため。DD-032）。
      # 戻すときは、この bookmark を `wrangler d1 time-travel restore` に渡す。記録できなければ適用しない。
      - name: 本番 D1 の戻り先を記録（Time Travel）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          report="$RUNNER_TEMP/d1-time-travel.txt"
          if ! pnpm exec wrangler d1 time-travel info hr-evaluation-db >"$report" 2>&1; then
            cat "$report"
            printf '::error::本番 D1 の戻り先を記録できなかったため、中止します。\n'
            exit 1
          fi
          cat "$report"
          {
            printf '## 適用前の本番 D1 の戻り先（Time Travel）\n\n'
            printf '```text\n'
            cat "$report"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: マイグレーション適用
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run db:migrate:remote

      # apply の終了コードだけで完了と見なさず、同じ本番 DB を再照会する。
      # 認証・通信失敗や未知の出力も成功扱いにしない。
      - name: 適用後の未適用マイグレーション確認
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          report="$RUNNER_TEMP/d1-migrations-after-apply.txt"
          if ! pnpm exec wrangler d1 migrations list hr-evaluation-db --remote >"$report" 2>&1; then
            cat "$report"
            printf '::error::適用後の本番 D1 を再確認できませんでした。\n'
            exit 1
          fi
          cat "$report"
          node scripts/verify-d1-migrations-list.mjs "$report"

# 手動で適用した場合は、このあと必ず Deploy を実行すること。
# 順番は「マイグレーション → デプロイ」で固定。逆にすると、新しいアプリが
# まだ存在しない列を読みにいって本番が落ちる。
#
# 「マイグレーションだけ済んで、アプリは古いまま」はexpand migrationなら安全な状態。
# 列が増えただけなら古いアプリはその列を知らないだけで動き続ける。
# 途中で止まったときは、この状態で止めておけばよい。
