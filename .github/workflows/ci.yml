# CI: 壊れたコードが main に入るのを防ぐ。何も壊せない（デプロイもDB操作もしない）。
# 実行時間の目安: 2〜4分。public リポジトリなら完全無料。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手で流したいときのため
  workflow_dispatch:

# 同じブランチに続けて push したとき、古い実行を打ち切る。
# 無料枠の節約と、結果が前後して混乱するのを防ぐ両方の意味がある。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 既定を読み取り専用にする。CI はリポジトリに何も書き込まない。
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # pnpm の版は package.json の packageManager から読む。
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # Node の版は .nvmrc の1か所だけで決める（手元・CI・本番の配布で同じ版にする）。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 依存のインストール
        run: pnpm install --frozen-lockfile

      # 文書が指している実装（ワークフロー・スクリプト）が消えていないかを見る。
      - name: 文書と実装の食い違い検査
        run: pnpm run check:docs

      # AIDD エージェントキットの実配置が編集元と食い違っていないかを見る。
      - name: エージェントキットの配置検査
        run: bash aidd-agent-kit/verify-codex-layout.sh

      # 直した危ない書き方が戻っていないかを見る（検査の中身は scripts/check-security-patterns.mjs。DD-032）。
      - name: 危ない書き方の検査
        run: pnpm run check:security

      # Cloudflare の環境変数の型定義（cloudflare-env.d.ts）を作る。
      # このファイルは .gitignore されているため、CI のまっさらなチェックアウトには存在しない。
      # 生成せずに typecheck すると「Property 'DB' does not exist on type 'CloudflareEnv'」で必ず落ちる。
      # wrangler.jsonc から作るだけなので Cloudflare の認証情報は要らない。
      - name: Cloudflare の型定義を生成
        run: pnpm run cf-typegen

      # 型チェックとテストは分けない。1つのジョブに入れるほうが
      # チェックアウトとインストールの重複がなく、結果的に安く速い。
      - name: 型チェック
        run: pnpm run typecheck

      # 網羅率つきで走らせる。評価の計算・保存・表示のどこかが試験されないまま
      # 増えたら、その時点で赤くする（下限は vitest.config.mts の thresholds）。
      # 網羅率は「あとで測る」と必ず下がるので、テストと同じ1回で測りきる。
      - name: テスト（網羅率の下限つき）
        run: pnpm run test:coverage


# 意図的に入れていないもの（入れたくなったら理由を書いてから入れること）
#
# - 本番ビルド
#     重い。しかも deploy.yml が必ずビルドするので、ここで通っても
#     デプロイが通る保証にはならない。二重に払う意味がない。
# - E2E / ブラウザテスト
#     時間と維持コストの割に、単体テスト＋デプロイ後のスモークで足りることが多い。
# - matrix（複数 Node バージョン）
#     実行数がそのまま本数分増える。動かす環境が1つなら1つでよい。
# - 自動 fix コミット（lint --fix して push する類）
#     CI がリポジトリに書き込むと、人が見ていない変更が main に入る。
# - 依存の脆弱性の検査と定期実行
#     security-audit.yml に分けた。新しい脆弱性はコードを変えなくても見つかるので、そちらは週1回も流す。
