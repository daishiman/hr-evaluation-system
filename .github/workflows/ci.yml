# CI: 壊れたコードが main に入るのを防ぐ。何も壊せない（デプロイもDB操作もしない）。
# 実行時間の目安: 2〜4分。public リポジトリなら完全無料。
#
# npm / yarn / pnpm のどれでもそのまま動く（ロックファイルから自動判別する）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手で流したいときのため
  workflow_dispatch:

# 同じブランチに続けて push したとき、古い実行を打ち切る。
# 無料枠の節約と、結果が前後して混乱するのを防ぐ両方の意味がある。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 既定を読み取り専用にする。CI はリポジトリに何も書き込まない。
permissions:
  contents: read

jobs:
  # このジョブ名（verify）を、ブランチ保護の必須チェックに指定する。
  # ワークフロー名（CI）ではないので注意。
  verify:
    # ubuntu 以外は課金倍率が上がる（Windows 2倍 / macOS 10倍）。理由なく変えない。
    runs-on: ubuntu-latest
    # 暴走したジョブが無料枠を食い潰さないための安全弁。短縮目的ではない。
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # 新規マイグレーション検知のため、比較元コミットまで遡れるようにする。
          fetch-depth: 0

      # マイグレーションを追加したまま Migrate ワークフローの実行を忘れると、
      # main への push は通っても Deploy が「未適用マイグレーションあり」で止まる。
      # ここで早めに気づけるよう警告だけ出す（CI 自体は失敗させない）。
      - name: 新規マイグレーションの検知
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          base_sha="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base_sha" ] || ! git cat-file -e "$base_sha" 2>/dev/null; then
            exit 0
          fi
          new_migrations=$(git diff --name-only --diff-filter=A "$base_sha" HEAD -- drizzle/migrations | grep '\.sql$' || true)
          if [ -n "$new_migrations" ]; then
            echo "::warning::新しいマイグレーションが追加されています。main にマージ後、必ず Migrate ワークフローを手動実行してください（実行し忘れると Deploy が止まります）: $(echo "$new_migrations" | tr '\n' ' ')"
          fi

      # 判別の根拠は「設定に書いた宣言」ではなく、ロックファイルが実在するかどうか。
      # 宣言は書き換え忘れるが、ロックファイルは実際に入れた事実の痕跡なのでズレない。
      - name: パッケージマネージャを判別
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "name=pnpm"                              >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=pnpm run"                           >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            # Yarn は v1 と v2以降（Berry）で引数が違う。.yarnrc.yml があれば Berry。
            if [ -f .yarnrc.yml ]; then
              echo "install=yarn install --immutable"       >> "$GITHUB_OUTPUT"
            else
              echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            fi
            echo "name=yarn"    >> "$GITHUB_OUTPUT"
            echo "run=yarn run" >> "$GITHUB_OUTPUT"
          else
            # npm install ではなく npm ci。install だとロックファイルを書き換えることがあり、
            # CI とローカルで入るものがズレる。
            echo "name=npm"       >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "run=npm run"    >> "$GITHUB_OUTPUT"
          fi

      # pnpm のときだけ pnpm 本体を入れる。
      # setup-node の cache より先に置くこと（逆だと「pnpm が見つからない」で落ちる）。
      - uses: pnpm/action-setup@v4
        if: steps.pm.outputs.name == 'pnpm'
        # バージョンは package.json の packageManager から読ませる。
        # ここで version: を指定すると、packageManager がある repo では
        # 「Multiple versions of pnpm specified」で落ちる。

      - uses: actions/setup-node@v4
        with:
          # wrangler が Node 22 以上を要求する。20 だと cf-typegen で落ちる。
          node-version: 22
          cache: ${{ steps.pm.outputs.name }}

      - name: 依存関係のインストール（${{ steps.pm.outputs.name }}）
        run: ${{ steps.pm.outputs.install }}

      # current/history の混在、安定IDの重複、主要文書のリンク切れを早期に止める。
      - name: 文書 drift 検査
        run: ${{ steps.pm.outputs.run }} check:docs

      # Cloudflare の環境変数の型定義（cloudflare-env.d.ts）を作る。
      # このファイルは .gitignore されているため、CI のまっさらなチェックアウトには存在しない。
      # 生成せずに typecheck すると「Property 'DB' does not exist on type 'CloudflareEnv'」で必ず落ちる。
      # wrangler.jsonc から作るだけなので Cloudflare の認証情報は要らない。
      - name: Cloudflare の型定義を生成
        run: ${{ steps.pm.outputs.run }} cf-typegen

      # 型チェックとテストは分けない。1つのジョブに入れるほうが
      # チェックアウトとインストールの重複がなく、結果的に安く速い。
      - name: 型チェック
        run: ${{ steps.pm.outputs.run }} typecheck

      # 網羅率つきで走らせる。評価の計算・保存・表示のどこかが試験されないまま
      # 増えたら、その時点で赤くする（下限は vitest.config.mts の thresholds）。
      # 網羅率は「あとで測る」と必ず下がるので、テストと同じ1回で測りきる。
      - name: テスト（網羅率の下限つき）
        run: ${{ steps.pm.outputs.run }} test:coverage


# 意図的に入れていないもの（入れたくなったら理由を書いてから入れること）
#
# - 本番ビルド
#     重い。しかも deploy.yml が必ずビルドするので、ここで通っても
#     デプロイが通る保証にはならない。二重に払う意味がない。
# - E2E / ブラウザテスト
#     時間と維持コストの割に、単体テスト＋デプロイ後のスモークで足りることが多い。
# - matrix（複数 Node バージョン）
#     実行数がそのまま本数分増える。動かす環境が1つなら1つでよい。
# - 自動 fix コミット（lint --fix して push する類）
#     CI がリポジトリに書き込むと、人が見ていない変更が main に入る。
# - schedule（定期実行）
#     誰も見ていない時間に無料枠だけ減る。
