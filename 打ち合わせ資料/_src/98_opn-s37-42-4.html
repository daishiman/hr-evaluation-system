<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>98 押すと出るもの ・ 評価の基準</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="common.css">
<style>
/* このボードだけの配置調整。色は var(--...) だけ。#hex や rgb() を書かない */
.board-body { gap: 18px; align-items: flex-start; }
.ocol { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.ocard { background: var(--bg-surface); border: 1px solid var(--line); border-radius: var(--radius-panel); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow-soft); }
.ocard .oh { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.ocard .ono { flex: none; font: 800 13px/22px var(--font-num); min-width: 22px; padding: 0 6px; border-radius: 11px; text-align: center; background: var(--anno); color: var(--anno-ink); }
.ocard .oh b { font-size: 15.5px; font-weight: 800; line-height: 1.35; }
.ocard .otype { font-size: 12px; font-weight: 800; padding: 1px 8px; border-radius: 4px; color: var(--note-how-ink); background: var(--note-how-bg); }
.ocard .otrig { font-size: 13px; color: var(--text-2); line-height: 1.45; }
.ocard .oimg { align-self: flex-start; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--bg-board); }
.ocard .oimg img { display: block; width: 100%; height: 100%; }
.ocard ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.5; }
.ocard .olab { font-size: 12px; font-weight: 800; color: var(--text-muted); margin-top: 2px; }
.ocard .onot { font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="board" data-board="98" data-type="pc" data-screens="S42">
  <header class="board-head">
    <div>
      <div class="kicker">画面の詳細 ・ 押すと出るもの ・ マネージャーと評価の確定（4/4）</div>
      <h1>押すと出るもの ・ 評価の基準</h1>
      <div class="lead">S42 評価の基準 で、ボタンや見出しを押すと出る小窓・一覧・説明と、その中身。</div>
    </div>
    <div class="meta">人事評価システムの説明書<br><span class="sample-flag">画面の中の名前と値は例です</span></div>
  </header>
  <main class="board-body"><div class="ocol"><div class="ocard" data-k="S42-o10"><div class="oh"><span class="ono">26</span><b>達成率の出し方</b><span class="otype">開いて見る</span></div><div class="otrig">S42 評価の基準 ・ 押すもの: 「等級要件達成率の出し方と、目標の上限」</div><div class="oimg" style="width:487px;height:82px"><img src="assets/shots/opn-s42-o10.png" alt=""></div><div class="olab">中に出るもの</div><ul><li>達成した項目数 ÷ 聞いた項目数</li><li>未回答は未達</li><li>半期の目標の上限は達成率に使わない</li></ul></div></div><div class="ocol"></div><div class="ocol"></div></main>
</div>
</body>
</html>
